<!-- 3D tilt for portfolio tiles (mouse only; touch screens keep flat cards) -->
<script>
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    document.querySelectorAll('.bento .tile').forEach(function (tile) {
      tile.addEventListener('pointermove', function (e) {
        var r = tile.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width;
        var y = (e.clientY - r.top) / r.height;
        tile.style.setProperty('--ry', ((x - 0.5) * 14).toFixed(2) + 'deg');
        tile.style.setProperty('--rx', ((0.5 - y) * 12).toFixed(2) + 'deg');
        tile.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
        tile.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      });
      tile.addEventListener('pointerleave', function () {
        tile.style.setProperty('--rx', '0deg');
        tile.style.setProperty('--ry', '0deg');
      });
    });
  })();
</script>

<!-- Drag to rotate the 3D cube on the About page -->
<script>
  (function () {
    var cube = document.querySelector('.cube');
    if (!cube) return;
    var rx = -14, ry = 0, dragging = false, lx = 0, ly = 0;
    cube.addEventListener('pointerdown', function (e) {
      dragging = true;
      lx = e.clientX;
      ly = e.clientY;
      cube.classList.add('is-dragging');
      cube.setPointerCapture(e.pointerId);
    });
    cube.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      ry += (e.clientX - lx) * 0.6;
      rx -= (e.clientY - ly) * 0.4;
      lx = e.clientX;
      ly = e.clientY;
      cube.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
    function stop() {
      dragging = false;
      cube.classList.remove('is-dragging');
    }
    cube.addEventListener('pointerup', stop);
    cube.addEventListener('pointercancel', stop);
  })();
</script>
